name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  web-check:
    name: Web lint, test and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install web dependencies
        run: npm install

      - name: Check formatting
        run: npx prettier --check .

      - name: Run unit tests
        run: npm test

      - name: Type check
        run: npm run typecheck

      - name: Lint strict
        run: npm run lint:strict

      - name: Build web renderer
        run: npm run build

      - name: Web CI summary
        if: always()
        run: |
          echo "## FotoBeat Web CI" >> "$GITHUB_STEP_SUMMARY"
          echo "- Node: $(node --version)" >> "$GITHUB_STEP_SUMMARY"
          echo "- npm: $(npm --version)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"

  desktop-package-smoke:
    name: Desktop package smoke
    runs-on: ubuntu-latest
    needs: web-check

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install web dependencies
        run: npm install

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm install

      - name: Package desktop directory
        working-directory: desktop
        run: npm run pack

      - name: Desktop CI summary
        if: always()
        run: |
          echo "## FotoBeat Desktop CI" >> "$GITHUB_STEP_SUMMARY"
          echo "- Node: $(node --version)" >> "$GITHUB_STEP_SUMMARY"
          echo "- npm: $(npm --version)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Desktop package smoke: npm run pack" >> "$GITHUB_STEP_SUMMARY"
