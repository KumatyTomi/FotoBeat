name: Windows Installer

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-windows-installer:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Web dependencies
        run: node scripts/ci-deps.mjs

      - name: Build web app
        run: npm run build

      - name: Desktop dependencies
        working-directory: desktop
        run: node ../scripts/ci-deps.mjs

      - name: Build Windows installer
        working-directory: desktop
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload Windows installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FotoBeat-Windows-Installer
          path: |
            desktop/release/*.exe
            desktop/release/*.yml
            desktop/release/*.blockmap
          if-no-files-found: error
