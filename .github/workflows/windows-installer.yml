name: Windows Installer

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows-installer:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Web dependencies
        run: node scripts/ci-deps.mjs

      - name: Build web app
        run: npm run build

      - name: Check packaged web asset paths
        run: node scripts/assert-electron-assets.mjs

      - name: Desktop dependencies
        working-directory: desktop
        run: node ../scripts/ci-deps.mjs

      - name: Build Windows installer
        working-directory: desktop
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload Windows installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FotoBeat-Windows-Installer
          path: |
            desktop/release/*.exe
            desktop/release/*.yml
            desktop/release/*.blockmap
          if-no-files-found: error

      - name: Publish GitHub Release artifacts
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = Get-ChildItem -Path desktop/release -File | Where-Object { $_.Extension -in '.exe', '.yml', '.blockmap' }
          if (-not $assets) {
            throw "No Windows installer assets found in desktop/release."
          }

          $tag = "${{ github.ref_name }}"
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag @($assets.FullName) --clobber
          } else {
            gh release create $tag @($assets.FullName) --title "FotoBeat $tag" --notes "Automated Windows installer release." --latest
          }
